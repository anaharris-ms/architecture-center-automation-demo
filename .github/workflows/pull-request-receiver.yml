name: Receive contributor pull request

on:
  pull_request_target:
    branches:
      - hackathon
    types:
      - opened
      - synchronize
      - labeled
      - closed
  pull_request_review:
    branches:
      - hackathon
    types:
      - submitted

defaults:
  run:
    working-directory: .github/contributor-automation

jobs:
  receive:
    name: Retrieve and correlate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
    concurrency:
      group: pull-request-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GITHUB_ALLOWED_PR_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GITHUB_STATE_BRANCH: submission-state
      GITHUB_STATE_REPOSITORY: ${{ github.repository }}
      PULL_REQUEST_INPUT: ${{ github.event.pull_request.number }}
      REPOSITORY_INPUT: ${{ github.repository }}

    steps:
      - name: Check out trusted automation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/contributor-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Process authoritative pull request
        env:
          GITHUB_EVENT_TOKEN: ${{ github.token }}
          GITHUB_STATE_TOKEN: ${{ github.token }}
          POWER_AUTOMATE_STAGE_URL: ${{ secrets.POWER_AUTOMATE_STAGE_URL }}
        run: >-
          npm run pull-request-receive --
          --repository "$REPOSITORY_INPUT"
          --pull-request "$PULL_REQUEST_INPUT"
